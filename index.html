<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#646d79" />
    <title>SmartPlanner · 让计划落在真实的时间里</title>
    <meta name="description" content="免费的浏览器日程规划工具：学习与工作任务自动排程，支持保存和导出。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=11" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">◷</span><span>smart<span class="brand-accent">planner</span></span></div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">让计划落在<br /><strong>真实的时间里。</strong></h1>
          <p class="hero-description">安排可用时间、固定活动与待办任务。每次调整，即刻看见新的计划。</p>
          <div class="scenario-switch" role="group" aria-label="切换演示场景">
            <button type="button" class="scenario-button active" data-scenario="student" aria-pressed="true">学期安排</button>
            <button type="button" class="scenario-button" data-scenario="project" aria-pressed="false">项目交付</button>
            <button type="button" class="scenario-button" data-scenario="custom" aria-pressed="false">我的计划</button>
          </div>
        </div>
      </section>

      <div class="context-bar">
        <div><strong id="scenario-title">正在加载…</strong></div>
      </div>

      <div class="planner-toolbar" aria-label="计划操作">
        <span id="save-status" role="status">正在准备…</span>
        <div class="toolbar-actions">
          <button type="button" id="new-plan">新建计划</button>
          <button type="button" id="import-plan">导入</button>
          <button type="button" id="export-plan">导出</button>
          <button type="button" id="reset-plan">重置示例</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden />
        </div>
      </div>

      <div class="workspace">
        <main class="center-column">
          <section class="schedule-panel" aria-labelledby="timeline-heading">
            <div class="schedule-heading"><div><h2 id="timeline-heading">时间轴</h2><p id="day-caption">按发生时间排列</p></div><div class="schedule-badge">即时排程</div></div>
            <div id="validation-banner" class="validation-banner" role="alert" hidden></div>
            <div id="timeline" class="timeline" aria-live="polite"></div>
          </section>
          <section class="unscheduled-panel" aria-labelledby="unscheduled-heading"><div class="section-heading"><h2 id="unscheduled-heading">未安排任务</h2></div><div id="unscheduled-list" aria-live="polite"></div></section>
        </main>

        <aside class="left-column" aria-label="固定安排与临时事件">
          <section class="card overview-card">
            <div class="section-heading"><h2>计划概览</h2></div>
            <div class="overview-grid">
              <div><strong id="metric-blocks">—</strong><span>工作块</span></div>
              <div><strong id="metric-confirmed">—</strong><span>已确认</span></div>
              <div><strong id="metric-unscheduled">—</strong><span>未安排</span></div>
            </div>
          </section>

          <section class="card">
            <div class="section-heading"><h2>可用时间</h2><span class="heading-count" id="availability-count">0</span></div>
            <div id="availability-list" class="event-list"></div>
            <form id="availability-form" class="compact-form"><div class="field-pair"><label>开始<input id="availability-start" class="short-date-input" type="text" inputmode="text" placeholder="10/21 08:00" required /></label><label>结束<input id="availability-end" class="short-date-input" type="text" inputmode="text" placeholder="10/21 17:00" required /></label></div><button type="submit" class="secondary-button">添加可用时段</button></form>
          </section>

          <section class="card">
            <div class="section-heading"><h2>固定安排</h2><span class="heading-count" id="event-count">0</span></div>
            <div id="event-list" class="event-list"></div>
          </section>

          <section class="card add-card">
            <div class="section-heading"><h2>添加固定安排</h2></div>
            <form id="event-form">
              <label>事件名称<input id="event-name" type="text" placeholder="例如：临时讨论会" required maxlength="80" /></label>
              <label>地点 / 说明<input id="event-place" type="text" placeholder="例如：图书馆 204" maxlength="80" /></label>
              <div class="field-pair"><label>开始<input id="event-start" class="short-date-input" type="text" inputmode="text" placeholder="10/21 09:00" required /></label><label>结束<input id="event-end" class="short-date-input" type="text" inputmode="text" placeholder="10/21 10:00" required /></label></div>
              <button type="submit" class="primary-button">加入并重新计算 <span>→</span></button>
            </form>
          </section>
        </aside>

        <aside class="right-column" aria-label="任务编辑">
          <section class="card task-card"><div class="section-heading"><h2>任务与截止时间</h2><span class="heading-count" id="task-count">0</span></div><div id="task-list" class="task-list"></div></section>
          <section class="card add-card"><div class="section-heading"><h2>添加任务</h2></div>
            <form id="task-form">
              <label>任务名称<input id="task-name" type="text" required maxlength="80" placeholder="例如：完成报告初稿" /></label>
              <div class="field-pair"><label>工时 / 分<input id="task-duration" type="number" min="1" max="2147483647" value="60" required /></label><label>截止时间<input id="task-deadline" class="short-date-input" type="text" inputmode="text" placeholder="10/21 17:00" required /></label></div>
              <label>前置任务（可选）<select id="task-dependency"><option value="">无</option></select></label>
              <label class="inline-check"><input id="task-split" type="checkbox" /> 允许分段安排</label>
              <label id="minimum-wrap" hidden>每段至少 / 分<input id="task-minimum" type="number" min="1" value="25" /></label>
              <button type="submit" class="primary-button">添加并排程 <span>→</span></button>
            </form>
          </section>
          <details class="assurance-card"><summary>排程规则</summary><p>已确认的时间块保持原位；其余任务会根据新活动重新安排。算法按截止时间贪心规划，不保证全局最优。</p></details>
        </aside>
      </div>
      <footer>SmartPlanner <span>无需登录 · 数据仅存于当前浏览器 · 可导入导出</span></footer>
    </div>
    <script type="module" src="./app.js?v=233b4d1"></script>
  </body>
</html>
