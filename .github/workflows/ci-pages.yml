name: Test and build
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: smartplanner-static-site
          path: dist/
